<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossa · PDF folder</title>
<style>
  :root { --bg: #0B0C10; --card: #12151B; --ink: #EEF0F5; --mute: #9AA0AB; --line: rgba(255,255,255,.1); --lime: #B8F26B; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; padding: 24px; }
  .card { width: min(520px, 100%); background: var(--card); border-radius: 20px; padding: 32px; box-shadow: inset 0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.5); }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  header img { width: 28px; height: 28px; }
  header b { font: 800 20px/1 -apple-system, "Inter", sans-serif; letter-spacing: -.04em; }
  h1 { font: 700 26px/1.15 -apple-system, "Inter", sans-serif; letter-spacing: -.03em; margin: 0 0 10px; }
  p { color: var(--mute); margin: 0 0 22px; }
  .now { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px var(--line); margin-bottom: 22px; }
  .now svg { flex: none; color: var(--lime); }
  .now small { display: block; color: var(--mute); font-size: 12px; }
  .now b { font-weight: 600; word-break: break-word; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button { border: 0; border-radius: 999px; padding: 12px 20px; font: 600 14px -apple-system, "Inter", sans-serif; cursor: pointer; background: var(--lime); color: #0B0C10; }
  button.ghost { background: rgba(255,255,255,.08); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
  .msg { margin-top: 18px; min-height: 22px; font-size: 14px; }
  .msg.ok { color: var(--lime); }
  .msg.err { color: #ff8a80; }
</style>
</head>
<body>
  <main class="card">
    <header><img src="icons/icon48.png" alt=""><b>glossa</b></header>
    <h1>Where should your PDFs go?</h1>
    <p>Pick any folder once. Every time a film ends, its vocabulary PDF is saved there automatically.</p>
    <div class="now" aria-live="polite">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <div><small>PDFs are saved in</small><b id="current">Downloads / Glossa</b></div>
    </div>
    <div class="row">
      <button id="choose">Choose folder</button>
      <button id="allow" class="ghost" hidden>Allow access again</button>
      <button id="reset" class="ghost" hidden>Use Downloads instead</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </main>
  <script src="folderstore.js"></script>
  <script src="folder.js"></script>
</body>
</html>
